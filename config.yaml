# mujoco-azure-offload configuration.
# Every value here can be overridden on the CLI (see `offload run --help`).

azure:
  # Leave blank to use whatever subscription your terminal's `az login` has active
  # (the tool prints which one in the plan before doing anything). Override: --subscription.
  subscription_id: ""
  resource_group: "mjoff-rg"      # must already exist (see README setup)
  region: "polandcentral"

storage:
  account: "mjoffstorage123"      # your storage account name (must already exist)
  container: "mjoff"              # created by the tool if missing
  # auth_mode: how the LOCAL tool reaches Blob data-plane.
  #   auto = try az-login RBAC, fall back to account key (fetched via az, in-memory only)
  #   rbac = require 'Storage Blob Data Contributor' on your az-login identity
  #   key  = always use the account key
  auth_mode: "auto"

compute:
  # Default size when no tier flag is given. Pick a machine per run with
  # --cheap / --moderate / --expensive (mapped under `tiers:` below), or --vm-size.
  vm_size: "Standard_F16s_v2"
  image: "Canonical:0001-com-ubuntu-server-jammy:22_04-lts-gen2:latest"
  spot: true                      # low-priority/spot by default; --force-dedicated to override
  max_spot_price: -1              # -1 = pay up to on-demand (evicted only on capacity)
  # Identity for the VM (self-deallocate + blob). Leave BLANK (recommended): the tool
  # gives the VM a system-assigned identity and auto-grants two tightly-scoped roles
  # (deallocate on just this VM, blob on just this run's container). Requires your
  # login to be able to create role assignments (Owner / User Access Administrator).
  # If it can't, pre-create a user-assigned identity + roles and put its resource id
  # here instead (see README "Restricted environments").
  managed_identity: ""
  os_disk_size_gb: 64
  # osmesa = pure-software (CPU) offscreen GL. These are GPU-less CPU VMs, so 'egl'
  # has no device to bind; use 'osmesa' for headless .png/.mp4, or 'disable' to skip.
  mujoco_gl: "osmesa"             # osmesa | egl | disable
  nproc: 0                        # 0 = use all cores on the VM

# Machine tiers selected by --cheap / --moderate / --expensive. Remap freely.
# Poland Central prices (live-checked at launch): F2s_v2 ~$0.018/hr spot (2 vCPU),
# F16s_v2 ~$0.14/hr spot (16 vCPU), F72s_v2 ~$0.65/hr spot (72 vCPU).
tiers:
  cheap: "Standard_F2s_v2"
  moderate: "Standard_F16s_v2"
  expensive: "Standard_F72s_v2"

job:
  job_module: "job"               # <module>.py in the bundle exposing the entry function
  entry_function: "run_scenario"  # run_scenario(scenario: dict, workdir: str) -> dict
  scenarios_file: "scenarios.json"

limits:                           # hard cost-safety knobs
  max_budget_usd: 5.0
  max_wall_clock_min: 60
  stuck_timeout_min: 10           # abort if no heartbeat for this long
  boot_timeout_min: 15            # abort if no progress file appears (boot/install failed)
  poll_interval_sec: 15
  heartbeat_interval_sec: 10

pricing:                          # only used if the Retail Prices API is unreachable
  fallback_hourly_usd: 3.045      # F72s_v2 on-demand (approx, eastus)
  fallback_spot_hourly_usd: 0.40
  disk_hourly_usd: 0.012
  ip_hourly_usd: 0.005
  storage_flat_usd: 0.02

tags:
  owner: ""                       # optional; stamped on every resource
