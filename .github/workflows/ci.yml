name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency (pyyaml only; tests use a fake Azure SDK)
        run: python -m pip install --upgrade pip pyyaml

      - name: Syntax check (python + bash)
        run: |
          python -m py_compile offload.py azoffload/*.py azoffload/remote/*.py
          bash -n azoffload/remote/watchdog.sh

      - name: Build job venv (numpy + mujoco) for the integration test
        run: |
          python -m venv jobenv
          ./jobenv/bin/pip install --upgrade pip
          ./jobenv/bin/pip install numpy mujoco

      - name: Run full test suite (unit + security + real-MuJoCo integration)
        env:
          MJOFF_TEST_JOBENV: ${{ github.workspace }}/jobenv
        run: python tests/run_tests.py
